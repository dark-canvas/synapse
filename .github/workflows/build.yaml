name: Build the kernel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        # Use the dtolnay/rust-toolchain action for easy setup
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly

      - name: Install core sources (kernel needs to rebuild this for target arch)
        run: rustup component add rust-src --toolchain nightly-x86_64-unknown-linux-gnu

      - name: Build
        run: make

      - name: Run tests
        run: make test

      - name: Install coverage tooling
        run: |
          rustup component add llvm-tools-preview --toolchain nightly-x86_64-unknown-linux-gnu
          cargo +nightly install cargo-llvm-cov --version 0.8.7 --locked

      - name: Generate code coverage report
        run: |
          mkdir -p target/coverage/html
          CARGO_TARGET_DIR=target/coverage cargo +nightly llvm-cov --target x86_64-unknown-linux-gnu --html --output-dir target/coverage/html --text --output-path target/coverage/coverage.txt
          cat target/coverage/coverage.txt

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/coverage

      #- name: Cargo fmt
      #  run: cargo fmt --all -- --check
      #  if: matrix.toolchain == 'nightly'

      #- name: Cargo clippy
      #  run: cargo clippy -- -D warnings
      #  if: matrix.toolchain == 'nightly'
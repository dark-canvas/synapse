name: Build the kernel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly

      - name: Install core sources (kernel needs to rebuild this for target arch)
        run: rustup component add rust-src --toolchain nightly-x86_64-unknown-linux-gnu

      - name: Build
        run: make

      - name: Run tests
        run: make test

      #- name: Cargo fmt
      #  run: cargo fmt --all -- --check
      #  if: matrix.toolchain == 'nightly'

      #- name: Cargo clippy
      #  run: cargo clippy -- -D warnings
      #  if: matrix.toolchain == 'nightly'

  coverage:
    needs: build_and_test
    runs-on: ubuntu-latest
    if: success()

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly

      - name: Install core sources (kernel needs to rebuild this for target arch)
        run: rustup component add rust-src --toolchain nightly-x86_64-unknown-linux-gnu

      - name: Install coverage tooling
        run: |
          rustup component add llvm-tools-preview --toolchain nightly-x86_64-unknown-linux-gnu
          cargo +nightly install cargo-llvm-cov --version 0.8.7 --locked

      - name: Generate HTML code coverage report
        run: |
          mkdir -p target/coverage/html
          CARGO_TARGET_DIR=target/coverage cargo +nightly llvm-cov --target x86_64-unknown-linux-gnu --json --summary-only --output-path target/coverage/summary.json
          CARGO_TARGET_DIR=target/coverage cargo +nightly llvm-cov --target x86_64-unknown-linux-gnu --html --output-dir target/coverage/html

      - name: Create Markdown summary from coverage JSON
        run: |
          python3 - <<'PY'
          import json, os
          import sys

          summary_path = 'target/coverage/summary.json'
          if not os.path.exists(summary_path):
              print('Coverage summary JSON not found', summary_path)
              sys.exit(0)

          with open(summary_path, 'r', encoding='utf-8') as fh:
              data = json.load(fh)

          rows = []
          for entry in data.get('data', []):
              for file in entry.get('files', []):
                  filename = file.get('filename') or file.get('file') or file.get('path')
                  summary = file.get('summary') or {}
                  if not filename or not isinstance(summary, dict):
                      continue
                  functions = summary.get('functions', {})
                  lines = summary.get('lines', {})
                  regions = summary.get('regions', {})
                  branches = summary.get('branches', {})
                  rows.append([
                      os.path.relpath(filename, os.getcwd()),
                      f"{functions.get('percent', 0.0):.1f}%",
                      f"{lines.get('percent', 0.0):.1f}%",
                      f"{regions.get('percent', 0.0):.1f}%",
                      f"{branches.get('percent', 0.0):.1f}%",
                  ])

          if not rows:
              print('No coverage records found in summary JSON')
              sys.exit(0)

          rows = sorted(rows, key=lambda r: r[0])[:50]
          md = []
          md.append('<!-- coverage-report -->')
          md.append('### Coverage report summary')
          md.append('')
          md.append('| File | Function | Line | Region | Branch |')
          md.append('| --- | --- | --- | --- | --- |')
          for row in rows:
              md.append('| ' + ' | '.join(row) + ' |')
          md.append('')
          md.append('_Full HTML report is attached to the workflow run as an artifact._')
          with open('coverage_summary.md', 'w', encoding='utf-8') as out:
              out.write('\n'.join(md))
          print('Wrote coverage_summary.md')
          PY

      - name: Post coverage summary to PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const md = fs.existsSync('coverage_summary.md') ? fs.readFileSync('coverage_summary.md', 'utf8') : 'Coverage summary not available.';
            const pr = context.payload.pull_request;
            if (!pr) {
              console.log('Not a pull_request event; skipping comment');
              return;
            }

            const marker = '<!-- coverage-report -->';
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });

            const existing = comments.data.find(comment => comment.body && comment.body.includes(marker));

            const body = `${marker}\n${md.replace(marker, '').trim()}`;

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              console.log(`Updated existing coverage comment ${existing.id}`);
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body,
            });
            console.log('Created new coverage comment');

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/coverage/html

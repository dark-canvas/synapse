name: Commit message check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  commit-message-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect commit messages
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            git log --reverse --no-merges "origin/${{ github.base_ref }}..HEAD" --pretty=format:%x1e%B%x1e > commit_messages.txt
          else
            if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
              git log --reverse --no-merges "${{ github.sha }}" --pretty=format:%x1e%B%x1e > commit_messages.txt
            else
              git log --reverse --no-merges "${{ github.event.before }}..${{ github.sha }}" --pretty=format:%x1e%B%x1e > commit_messages.txt
            fi
          fi

          if [ ! -s commit_messages.txt ]; then
            echo "No commit messages found; nothing to validate."
            exit 0
          fi

      - name: Validate commit messages
        run: python3 .github/scripts/check_commit_messages.py commit_messages.txt
